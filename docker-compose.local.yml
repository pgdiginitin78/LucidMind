services:
  mysql:
    image: mysql:8.4
    container_name: lucidmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: lucidmind
    ports:
      - "3306:3306"
    volumes:
      - lucidmind_mysql:/var/lib/mysql
volumes:
  lucidmind_mysql:
